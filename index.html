<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج كود HTML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #202024;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            color: #00adb5;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="url"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #323238;
            border-radius: 6px;
            background-color: #121214;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            border-color: #00adb5;
        }

        button {
            padding: 12px 24px;
            background-color: #00adb5;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #008c95;
        }

        .result-container {
            position: relative;
            margin-top: 20px;
        }

        .btn-copy {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 6px 12px;
            background-color: #323238;
            font-size: 13px;
        }

        .btn-copy:hover {
            background-color: #42424a;
        }

        textarea {
            width: 100%;
            height: 400px;
            background-color: #121214;
            border: 2px solid #323238;
            border-radius: 6px;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #a8a8b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🗂️ مستخرج كود HTML للمواقع</h1>
    
    <div class="input-group">
        <input type="url" id="targetUrl" placeholder="ضع رابط الموقع هنا (مثال: https://example.com)" required>
        <button onclick="fetchHTML()">استخراج الكود</button>
    </div>

    <div id="statusMessage" class="status"></div>

    <div class="result-container">
        <button class="btn-copy" onclick="copyCode()">نسخ الكود</button>
        <textarea id="outputHtml" placeholder="كود الـ HTML سيظهر هنا..." readonly></textarea>
    </div>
</div>

<script>
    async function fetchHTML() {
        const urlInput = document.getElementById('targetUrl').value.trim();
        const outputTextArea = document.getElementById('outputHtml');
        const statusMessage = document.getElementById('statusMessage');

        if (!urlInput) {
            alert('الرجاء إدخال رابط الموقع أولاً!');
            return;
        }

        // تنظيف الشاشة وتجهيز كود التحميل
        outputTextArea.value = '';
        statusMessage.textContent = 'جاري جلب كود الموقع، يرجى الانتظار...';
        statusMessage.style.color = '#00adb5';

        try {
            // استخدام البروكسي لتخطي حماية CORS في المتصفح
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlInput)}`;
            
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('فشل في الاتصال بالرابط');

            const data = await response.json();
            
            if (data.contents) {
                outputTextArea.value = data.contents;
                statusMessage.textContent = 'تم استخراج الكود بنجاح!';
                statusMessage.style.color = '#00ff66';
            } else {
                throw new Error('محتوى الصفحة فارغ أو غير مصرح بجلبها');
            }

        } catch (error) {
            outputTextArea.value = '';
            statusMessage.textContent = 'حدث خطأ: تأكد من صحة الرابط أو جرب موقعاً آخر.';
            statusMessage.style.color = '#e04040';
            console.error(error);
        }
    }

    function copyCode() {
        const outputTextArea = document.getElementById('outputHtml');
        if (!outputTextArea.value) {
            alert('لا يوجد كود لنسخه بعد!');
            return;
        }
        
        outputTextArea.select();
        document.execCommand('copy');
        alert('تم نسخ كود الـ HTML إلى الحافظة!');
    }
</script>

</body>
</html>
